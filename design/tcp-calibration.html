<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Tcp标定工具</title>
<style>
  :root {
    --paper: #e7e1d4;
    --paper-2: #f6f1e7;
    --ink: #1c1915;
    --muted: #6f685f;
    --line: #ddd4c6;
    --card: #fbf7f0;
    --pine: #1b3330;
    --pine-2: #244640;
    --copper: #c4622d;
    --copper-deep: #9d4c20;
    --stage: #14211e;
    --stage-2: #1c2e29;
    --x: #e25b45;
    --y: #3cce8e;
    --z: #6cb4ff;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1600px;
    height: 900px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  input { border: 0; background: transparent; outline: none; }

  .app {
    width: 1600px;
    height: 900px;
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 90px),
      var(--paper);
  }

  header {
    height: 72px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: var(--copper);
    color: white;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    flex: none;
  }
  .titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.3;
    white-space: nowrap;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .manual {
    height: 36px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    font-size: 13.5px;
    font-weight: 600;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper-2);
    font-size: 16px;
    color: var(--ink);
    line-height: 1;
  }
  .icon-btn.close { font-size: 18px; }

  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 292px 1fr;
  }

  aside {
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid var(--line);
    background: rgba(246, 241, 231, 0.55);
  }
  .section-label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .section-label b {
    font-weight: 600;
    color: var(--copper);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: 0;
    font-size: 11px;
  }

  .modes { display: flex; flex-direction: column; gap: 8px; }
  .mode {
    height: 62px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    text-align: left;
  }
  .mode .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid #b7aea2;
    flex: none;
    display: grid;
    place-items: center;
  }
  .mode .name { font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }
  .mode.on {
    background: var(--pine);
    border-color: var(--pine);
    color: #f6f1e7;
  }
  .mode.on .dot { border-color: #e7c2ad; }
  .mode.on .dot i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f0b48a;
    display: block;
  }
  .euler-order {
    margin-left: auto;
    width: 64px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: #f6f1e7;
    text-align: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 560;
  }

  .units {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    padding: 12px 12px 11px;
  }
  .unit-row { display: flex; gap: 8px; }
  .chip {
    flex: 1;
    background: #f3eee4;
    border-radius: 8px;
    padding: 8px 10px 7px;
  }
  .chip span {
    display: block;
    font-size: 11px;
    color: var(--muted);
  }
  .chip strong {
    display: block;
    margin-top: 2px;
    font-size: 14px;
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  .unit-note {
    margin: 8px 2px 0;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--muted);
  }

  .legend {
    margin-top: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    background: #f3eee4;
  }
  .legend-row strong { display: block; font-size: 13px; font-weight: 650; }
  .legend-row span { display: block; margin-top: 1px; font-size: 11px; color: var(--muted); }
  .triad { flex: none; display: block; }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .method {
    height: 46px;
    border-radius: 12px;
    border: 1.5px solid var(--pine);
    background: transparent;
    font-size: 15px;
    font-weight: 620;
  }
  .save {
    height: 50px;
    margin-top: 4px;
    border: 0;
    border-radius: 12px;
    background: var(--copper);
    color: white;
    font-size: 15px;
    font-weight: 670;
    letter-spacing: 0.02em;
  }

  main {
    min-width: 0;
    min-height: 0;
    padding: 14px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .stage {
    flex: 1;
    min-height: 0;
    position: relative;
    border-radius: 18px 18px 8px 8px;
    background:
      radial-gradient(900px 420px at 38% 62%, rgba(70, 120, 104, 0.28), transparent 70%),
      linear-gradient(180deg, var(--stage-2), var(--stage) 55%);
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .bracket {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1.5px solid rgba(196, 98, 45, 0.75);
    z-index: 2;
  }
  .bracket.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }
  .fps {
    position: absolute;
    top: 18px;
    left: 46px;
    z-index: 3;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(246, 241, 231, 0.72);
  }
  .stage svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .flange-note {
    position: absolute;
    left: 46px;
    bottom: 20px;
    z-index: 3;
    margin: 0;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(246, 241, 231, 0.1);
    color: #f3e6d4;
    font-size: 13px;
    letter-spacing: 0.01em;
    backdrop-filter: blur(6px);
  }

  .dock {
    position: relative;
    z-index: 4;
    display: flex;
    gap: 22px;
    align-items: stretch;
    height: 228px;
    flex: none;
  }
  .group {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .group.four { flex: 4; }
  .group.two { flex: 2; }
  .group-label {
    flex: none;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding-left: 2px;
  }
  .cluster {
    display: flex;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .card {
    flex: 1;
    min-width: 0;
    background: var(--card);
    border: 1px solid #e5dccb;
    border-radius: 14px;
    box-shadow: 0 8px 18px rgba(40, 32, 20, 0.05);
    padding: 8px 11px 6px;
    display: flex;
    flex-direction: column;
  }
  .group.two .card { background: #f3eee6; }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .pid {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 680;
    color: var(--copper-deep);
    letter-spacing: 0.02em;
  }
  .card-head em {
    font-style: normal;
    font-size: 10px;
    color: #b3aa9e;
    letter-spacing: 0.04em;
  }
  .field {
    display: grid;
    grid-template-columns: 26px 1fr 22px;
    align-items: center;
    gap: 4px;
    height: 25px;
  }
  .field label {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .field input {
    height: 22px;
    border-bottom: 1px solid #e3d9c9;
    font-size: 12.5px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    padding: 0 2px;
  }
  .field i {
    font-style: normal;
    font-size: 10px;
    color: #a79e92;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark">HS</div>
        <div class="titles">
          <h1>Tcp标定工具</h1>
          <p class="hint">可以点击查看手册按钮打开Tcp标定流程</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="manual" type="button">查看手册</button>
        <button class="icon-btn" type="button" aria-label="帮助">?</button>
        <button class="icon-btn close" type="button" aria-label="关闭">×</button>
      </div>
    </header>

    <div class="workspace">
      <aside>
        <div>
          <div class="section-label"><b>01</b>姿态表示</div>
          <div class="modes" style="margin-top:10px">
            <div class="mode on">
              <span class="dot"><i></i></span>
              <span class="name">欧拉角</span>
              <input class="euler-order" value="ZYX" aria-label="欧拉角顺序" />
            </div>
            <div class="mode">
              <span class="dot"></span>
              <span class="name">四元数</span>
            </div>
            <div class="mode">
              <span class="dot"></span>
              <span class="name">旋转矢量</span>
            </div>
          </div>
        </div>

        <div>
          <div class="section-label"><b>02</b>数据单位</div>
          <div class="units" style="margin-top:10px">
            <div class="unit-row">
              <div class="chip"><span>距离</span><strong>mm</strong></div>
              <div class="chip"><span>角度</span><strong>Degree</strong></div>
            </div>
            <p class="unit-note">提示:输入数据中距离单位为mm，<br>角度单位为Degree</p>
          </div>
        </div>

        <div>
          <div class="section-label"><b>03</b>坐标系</div>
          <div class="legend">
            <div class="legend-row">
              <svg class="triad" width="36" height="28" viewBox="0 0 36 28" aria-hidden="true">
                <line x1="14" y1="18" x2="32" y2="24" stroke="#e25b45" stroke-width="1.7"/>
                <line x1="14" y1="18" x2="4" y2="26" stroke="#3cce8e" stroke-width="1.7"/>
                <line x1="14" y1="18" x2="14" y2="4" stroke="#6cb4ff" stroke-width="1.7"/>
                <circle cx="14" cy="18" r="1.8" fill="#1c1915"/>
              </svg>
              <div>
                <strong>法兰坐标系</strong>
                <span>尺寸更大</span>
              </div>
            </div>
            <div class="legend-row">
              <svg class="triad" width="36" height="28" viewBox="0 0 36 28" aria-hidden="true">
                <line x1="16" y1="16" x2="26" y2="20" stroke="#e25b45" stroke-width="1.5"/>
                <line x1="16" y1="16" x2="10" y2="21" stroke="#3cce8e" stroke-width="1.5"/>
                <line x1="16" y1="16" x2="16" y2="8" stroke="#6cb4ff" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="1.5" fill="#1c1915"/>
              </svg>
              <div>
                <strong>TCP</strong>
                <span>尺寸较小</span>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <div class="section-label"><b>04</b>标定</div>
          <button class="method" type="button">4点法标定</button>
          <button class="method" type="button">6点法标定</button>
          <button class="save" type="button">保存标定数据</button>
        </div>
      </aside>

      <main>
        <section class="stage" aria-label="坐标系预览">
          <i class="bracket tl"></i>
          <i class="bracket tr"></i>
          <i class="bracket bl"></i>
          <i class="bracket br"></i>
          <div class="fps">0 FPS</div>
          <svg viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid meet">
            <defs>
              <marker id="ax" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M0 1.1 L9 5 L0 8.9 Z" fill="#e25b45"/>
              </marker>
              <marker id="ay" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M0 1.1 L9 5 L0 8.9 Z" fill="#3cce8e"/>
              </marker>
              <marker id="az" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M0 1.1 L9 5 L0 8.9 Z" fill="#6cb4ff"/>
              </marker>
              <marker id="ax2" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 1.1 L9 5 L0 8.9 Z" fill="#e25b45"/>
              </marker>
              <marker id="ay2" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 1.1 L9 5 L0 8.9 Z" fill="#3cce8e"/>
              </marker>
              <marker id="az2" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 1.1 L9 5 L0 8.9 Z" fill="#6cb4ff"/>
              </marker>
            </defs>

            <ellipse cx="430" cy="400" rx="250" ry="72" fill="none" stroke="rgba(243,230,212,0.08)" stroke-width="1.2"/>
            <ellipse cx="430" cy="400" rx="168" ry="48" fill="none" stroke="rgba(243,230,212,0.07)" stroke-width="1.2"/>
            <ellipse cx="430" cy="392" rx="118" ry="34" fill="rgba(196,98,45,0.08)" stroke="#c4622d" stroke-opacity="0.8" stroke-width="1.6"/>

            <line x1="430" y1="392" x2="620" y2="452" stroke="#e25b45" stroke-width="2.6" marker-end="url(#ax)"/>
            <line x1="430" y1="392" x2="268" y2="468" stroke="#3cce8e" stroke-width="2.6" marker-end="url(#ay)"/>
            <line x1="430" y1="392" x2="430" y2="176" stroke="#6cb4ff" stroke-width="2.6" marker-end="url(#az)"/>
            <circle cx="430" cy="392" r="4.5" fill="#f6f1e7"/>

            <text x="636" y="468" fill="#e25b45" font-size="16" font-family="Inter, sans-serif" font-weight="650">X</text>
            <text x="236" y="486" fill="#3cce8e" font-size="16" font-family="Inter, sans-serif" font-weight="650">Y</text>
            <text x="442" y="168" fill="#6cb4ff" font-size="16" font-family="Inter, sans-serif" font-weight="650">Z</text>
            <text x="430" y="534" fill="#f3e6d4" font-size="18" text-anchor="middle" font-family="WenQuanYi Micro Hei, sans-serif">法兰坐标系</text>

            <ellipse cx="860" cy="250" rx="54" ry="16" fill="rgba(246,241,231,0.04)" stroke="rgba(243,230,212,0.55)" stroke-width="1.3"/>
            <line x1="860" y1="250" x2="948" y2="278" stroke="#e25b45" stroke-width="2" marker-end="url(#ax2)"/>
            <line x1="860" y1="250" x2="786" y2="286" stroke="#3cce8e" stroke-width="2" marker-end="url(#ay2)"/>
            <line x1="860" y1="250" x2="860" y2="152" stroke="#6cb4ff" stroke-width="2" marker-end="url(#az2)"/>
            <circle cx="860" cy="250" r="3.2" fill="#f6f1e7"/>
            <text x="860" y="322" fill="rgba(243,230,212,0.86)" font-size="15" text-anchor="middle" font-family="Inter, sans-serif" font-weight="640">TCP</text>
          </svg>
          <p class="flange-note">提示:尺寸更大的为法兰坐标系</p>
        </section>

        <section class="dock" id="dock" aria-label="标定点"></section>
      </main>
    </div>
  </div>

  <script>
    const axes = [
      ["X", "mm"],
      ["Y", "mm"],
      ["Z", "mm"],
      ["Rx", "°"],
      ["Ry", "°"],
      ["Rz", "°"]
    ];
    const dock = document.getElementById("dock");
    function cluster(ids, extra, caption) {
      const group = document.createElement("div");
      group.className = "group " + extra;
      const cap = document.createElement("div");
      cap.className = "group-label";
      cap.textContent = caption;
      const wrap = document.createElement("div");
      wrap.className = "cluster";
      group.append(cap, wrap);
      ids.forEach((id) => {
        const card = document.createElement("article");
        card.className = "card";
        const head = document.createElement("div");
        head.className = "card-head";
        head.innerHTML = '<span class="pid">' + id + '</span>';
        card.appendChild(head);
        axes.forEach(([name, unit]) => {
          const row = document.createElement("div");
          row.className = "field";
          const label = document.createElement("label");
          label.textContent = name;
          const input = document.createElement("input");
          input.setAttribute("aria-label", id + " " + name);
          const u = document.createElement("i");
          u.textContent = unit;
          row.append(label, input, u);
          card.appendChild(row);
        });
        wrap.appendChild(card);
      });
      dock.appendChild(group);
    }
    cluster(["P1", "P2", "P3", "P4"], "four", "P1 – P4");
    cluster(["P5", "P6"], "two", "P5 – P6");
  </script>
</body>
</html>
